name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check out Hermes contract source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 19bc02ff8e1b0c201901020eefd48dbbc4c36c74
          path: .hermes-agent
      - name: Install Hermes contract runtime
        run: python -m pip install -e .hermes-agent
      - name: Test provider
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-agent
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q hermes-plugin scripts tests
      - name: Installer smoke test
        run: python scripts/install.py --hermes-home "$RUNNER_TEMP/hermes-home"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
